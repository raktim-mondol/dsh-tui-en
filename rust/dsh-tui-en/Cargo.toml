[package]
name = "dsh-tui-en"
version = "0.1.0"
edition = "2021"
description = "English Ratatui front door for DeepSeek Harness (TUI Channel + DeepSeek API)"
license = "MIT"
repository = "https://github.com/raktim-mondol/dsh-tui-en"
readme = "README.md"
keywords = ["tui", "deepseek", "dsh", "ratatui"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
unicode-width = "0.2"
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
