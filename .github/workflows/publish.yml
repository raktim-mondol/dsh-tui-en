name: Publish

# Release entry: push a v* tag (git tag v0.4.2 && git push origin v0.4.2).
# First publish still uses NPM_TOKEN from repo Secrets; the tag version must
# match package.json. OIDC is only used to generate npm provenance.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    env:
      # Gate scripts assert zh UI copy (same convention as CI).
      DSH_TUI_LANG: zh
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm compile

      - name: Verify clean compile output
        run: |
          test -f lib/types/index.js
          test -f lib/types/dsh-adapter/invariant.js

      - run: pnpm verify:build

      - run: pnpm verify:package

      # Fail immediately when the tag and package.json version disagree, so
      # the wrong version cannot be published.
      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          [ "$tag" = "$pkg" ] || { echo "tag $tag != package.json $pkg"; exit 1; }

      - run: node --import tsx/esm scripts/repro-askpanel.tsx

      - run: node --import tsx/esm scripts/repro-toolcards.tsx

      # /provider 向导与面板 hideCustomInput 回归（发版门禁同 CI）。
      - run: node scripts/verify-provider-wizard.mjs
      - run: node --import tsx/esm scripts/verify-askpanel-hide-custom-input.tsx

      - run: pnpm publish --no-git-checks --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
