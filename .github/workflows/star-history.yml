name: Star History

# GitHub announced on 2026-06-30 that it restricts the stargazers endpoint
# (readable only by the repo owner/collaborators), so third-party hosted
# services (api.star-history.com/svg) can no longer render trend charts for
# public repos. This workflow reads star data with the repo's own
# GITHUB_TOKEN (owner identity), reuses star-history's official renderer to
# generate a static PNG, and commits it to the bot-star-history branch; the
# README references that branch's raw link (main has a ruleset that forbids
# direct pushes, so the chart lives on its own branch).
# Reference: https://github.com/narayann7/star-history-action

on:
  schedule:
    - cron: '0 0 * * *'   # refreshes once a day at UTC 0:00
  watch:
    types: [started]      # refreshes immediately when someone stars the repo
  workflow_dispatch:      # supports manual triggering

permissions:
  contents: write

concurrency:
  group: star-history
  cancel-in-progress: true   # merges into a single run during a star spike

jobs:
  star-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Switch to the chart-only branch (based on the latest main, synced with the remote)
        run: |
          git checkout -B bot-star-history origin/main
          # No such branch on the remote on the first run; every run resets the remote to the latest main (unprotected, force is safe)
          git push --force origin bot-star-history
          git branch --show-current
      - uses: narayann7/star-history-action@v1
        with:
          # repos defaults to the current repository (${{ github.repository }})
          update-readme: false   # main's README is referenced by maintainers via a fixed raw URL; no action rewrite needed
          readme-format: png     # npm doesn't render <picture>, use a plain markdown PNG (the README ships with the package)
          themes: light          # png mode uses a single theme only, to reduce rendering and redundant repo files
          commit-message: 'chore: update Star History trend chart [skip ci]'
